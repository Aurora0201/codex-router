name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check release metadata
        run: npm run release:check

      - name: Run gateway integration tests
        run: npm run test:e2e

      - name: Inspect npm package
        run: npm run pack:check

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/pack-release.ps1

      - name: Smoke test installed package
        shell: pwsh
        run: |
          $tarball = Get-ChildItem -LiteralPath release -Filter *.tgz | Select-Object -First 1
          if (-not $tarball) { throw "release tarball was not created" }
          node scripts/smoke-packed-package.mjs $tarball.FullName
